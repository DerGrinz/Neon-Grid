kind = "mobile"
previewPath = "/"
title = "NEON GRID"
version = "1.0.0"
id = "artifacts/neon-grid"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20232

[services.development]
run = "pnpm --filter @workspace/neon-grid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neon-grid", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/neon-grid", "run", "serve" ]

[services.env]
PORT = "20232"
BASE_PATH = "/"
